# Fracture CMS — Production Configuration
#
# All secrets and environment-specific values MUST be set via environment
# variables. Never commit secrets to this file.

logger:
  enable: true
  pretty_backtrace: false
  level: warn
  format: json

server:
  port: {{ get_env(name="PORT", default="5150") }}
  binding: {{ get_env(name="SERVER_BINDING", default="0.0.0.0") }}
  host: {{ get_env(name="APP_URL", default="https://example.com") }}
  middlewares:
    static:
      enable: true
      must_exist: true
      precompressed: false
      folder:
        uri: "/static"
        path: "assets/static"
      fallback: "assets/static/404.html"

workers:
  mode: BackgroundAsync

mailer:
  smtp:
    enable: {{ get_env(name="MAILER_ENABLED", default="false") }}
    host: {{ get_env(name="MAILER_HOST", default="localhost") }}
    port: {{ get_env(name="MAILER_PORT", default="587") }}
    secure: true
    auth:
      user: {{ get_env(name="MAILER_USER", default="") }}
      password: {{ get_env(name="MAILER_PASSWORD", default="") }}

# OIDC Single Sign-On Configuration
#
# `required: true` makes the app refuse to boot with OIDC misconfigured —
# safer than silently falling back to no auth. Override via OIDC_REQUIRED=false
# only for one-shot debug starts; never run a public deployment without it.
settings:
  # Background job runner (executes queued job_runs, evaluates cron schedules).
  jobs:
    enabled: {{ get_env(name="JOBS_RUNNER_ENABLED", default="true") }}
    poll_interval_seconds: {{ get_env(name="JOBS_POLL_INTERVAL_SECONDS", default="15") }}
  oidc:
    required: {{ get_env(name="OIDC_REQUIRED", default="true") }}
    provider_name: {{ get_env(name="OIDC_PROVIDER_NAME", default="oidc") }}
    issuer_url: {{ get_env(name="OIDC_ISSUER_URL", default="http://localhost:8080") }}
    client_id: "{{ get_env(name='OIDC_CLIENT_ID', default='') }}"
    client_secret: "{{ get_env(name='OIDC_CLIENT_SECRET', default='') }}"
    project_id: "{{ get_env(name='OIDC_PROJECT_ID', default='') }}"
    redirect_uri: {{ get_env(name="OIDC_REDIRECT_URI", default="http://localhost:5150/api/auth/oidc/callback") }}
    post_logout_redirect_uri: {{ get_env(name="OIDC_POST_LOGOUT_REDIRECT_URI", default="http://localhost:5150") }}
    # Treat a MISSING email_verified claim as verified. Only enable for IdPs
    # that are known to release only verified emails but never emit the claim
    # (e.g. some Azure AD / SAML-bridge setups); without it, users of such
    # IdPs cannot link accounts or auto-accept invites. An explicit
    # email_verified=false from the IdP is always honored.
    assume_email_verified: {{ get_env(name="OIDC_ASSUME_EMAIL_VERIFIED", default="false") }}
    scopes:
      - openid
      - email
      - profile

database:
  uri: {{ get_env(name="DATABASE_URL", default="sqlite:///app/data/fracture-cms.sqlite?mode=rwc") }}
  enable_logging: false
  connect_timeout: {{ get_env(name="DB_CONNECT_TIMEOUT", default="500") }}
  idle_timeout: {{ get_env(name="DB_IDLE_TIMEOUT", default="500") }}
  min_connections: {{ get_env(name="DB_MIN_CONNECTIONS", default="1") }}
  max_connections: {{ get_env(name="DB_MAX_CONNECTIONS", default="5") }}
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false

auth:
  jwt:
    secret: {{ get_env(name="JWT_SECRET") }}
    expiration: 900 # 15 minutes
    location:
      - from: Bearer
      - from: Cookie
        name: jwt
