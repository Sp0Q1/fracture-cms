# ── Production Compose ─────────────────────────────────────────────
#
# Setup flow:
#   1. ./dev/gen-env.sh example.com auth.example.com > .env.prod
#   2. podman compose -f compose.prod.yaml up -d zitadel-db zitadel
#   3. ./dev/setup-oidc.sh          # bootstrap OIDC project + app
#   4. podman compose -f compose.prod.yaml up -d
#
# All ports bind to 127.0.0.1 — put nginx/caddy in front for TLS.
# See deploy/nginx.conf.template for a ready-made reverse proxy config.

services:
  # ── App Database ──────────────────────────────────────────────────
  app-db:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fracture
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
      POSTGRES_DB: fracture_cms
    volumes:
      - app_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fracture -d fracture_cms"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Zitadel Database (separate for isolation) ────────────────────
  zitadel-db:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${ZITADEL_DB_POSTGRES_PASSWORD:?ZITADEL_DB_POSTGRES_PASSWORD is required}
      POSTGRES_DB: zitadel
    volumes:
      - zitadel_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zitadel"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Zitadel Identity Provider ────────────────────────────────────
  zitadel:
    image: ghcr.io/zitadel/zitadel:latest
    restart: unless-stopped
    command: start-from-init --masterkey "${ZITADEL_MASTERKEY:?ZITADEL_MASTERKEY is required}" --tlsMode external
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: zitadel-db
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_DB_ZITADEL_PASSWORD:?ZITADEL_DB_ZITADEL_PASSWORD is required}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${ZITADEL_DB_POSTGRES_PASSWORD:?ZITADEL_DB_POSTGRES_PASSWORD is required}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_EXTERNALSECURE: "true"
      ZITADEL_EXTERNALPORT: 443
      ZITADEL_EXTERNALDOMAIN: ${AUTH_DOMAIN:?AUTH_DOMAIN is required}
      ZITADEL_TLS_ENABLED: "false"
      # Machine user with PAT for API provisioning (used by setup-oidc.sh)
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: zitadel-admin-sa
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Admin
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2030-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_LOGINPOLICY_ALLOWREGISTER: "true"
      # SMTP
      ZITADEL_FIRSTINSTANCE_SMTPCONFIGURATION_SMTP_HOST: "${SMTP_HOST:-}:${SMTP_PORT:-587}"
      ZITADEL_FIRSTINSTANCE_SMTPCONFIGURATION_SMTP_USER: ${SMTP_USER:-}
      ZITADEL_FIRSTINSTANCE_SMTPCONFIGURATION_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ZITADEL_FIRSTINSTANCE_SMTPCONFIGURATION_TLS: "true"
      ZITADEL_FIRSTINSTANCE_SMTPCONFIGURATION_FROM: "noreply@${AUTH_DOMAIN}"
      ZITADEL_FIRSTINSTANCE_SMTPCONFIGURATION_FROMNAME: "Fracture CMS"
    depends_on:
      zitadel-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ZITADEL_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "/app/zitadel ready"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  # ── Application ──────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Containerfile.prod
    restart: unless-stopped
    userns_mode: keep-id
    depends_on:
      app-db:
        condition: service_healthy
      zitadel:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-5150}:5150"
    volumes:
      - app_data:/app/data
    environment:
      LOCO_ENV: production
      DATABASE_URL: "postgres://fracture:${APP_DB_PASSWORD:?}@app-db:5432/fracture_cms"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      OIDC_ISSUER_URL: "https://${AUTH_DOMAIN:?AUTH_DOMAIN is required}"
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?OIDC_CLIENT_ID is required}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?OIDC_CLIENT_SECRET is required}
      OIDC_REDIRECT_URI: "https://${APP_DOMAIN:?APP_DOMAIN is required}/api/auth/oidc/callback"
      MAILER_HOST: ${MAILER_HOST:-}
      MAILER_PORT: ${MAILER_PORT:-587}
      MAILER_USER: ${MAILER_USER:-}
      MAILER_PASSWORD: ${MAILER_PASSWORD:-}
    env_file:
      - .env.prod

volumes:
  app_db_data:
  zitadel_db_data:
  app_data:
