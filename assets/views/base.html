<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}{% endblock title %}</title>
  <link rel="stylesheet" href="/static/oat.min.css" integrity="sha384-Q7tDn81qF6GoBv+Rdj5l6JFr2qaiXG01Z5dT8jRpp5lE+6IZx8as9X/Igi7ISdBP" crossorigin="anonymous">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/oat.min.js" integrity="sha384-/Trl5iuXWQS6d7T9TWGsfbC7cIDm88CDZc+BdI3LCdclFglQVOz7AmU+M7R5IQE/" crossorigin="anonymous" defer></script>
  <script src="/static/app.js" defer></script>
  {% block head %}

  {% endblock head %}
</head>

<body{% if user_name %} data-authenticated{% endif %}>
    <nav data-topnav>
        <span><a href="/"><strong>Fracture CMS</strong></a></span>
        <span><a href="/movies">Movies</a></span>
        {% if user_name %}
            <span class="nav-end">{{ user_name }} · <a href="/api/auth/oidc/logout">Sign out</a></span>
        {% else %}
            <span class="nav-end"><a href="/api/auth/oidc/authorize">Sign in</a></span>
        {% endif %}
    </nav>
    <main class="container">
        <h1>{% block page_title %}{% endblock page_title %}</h1>
        {% block content %}
        {% endblock content %}
    </main>
  {% block js %}

  {% endblock js %}
</body>

</html>
