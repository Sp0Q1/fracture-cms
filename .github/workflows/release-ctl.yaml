name: Release fracture-ctl

on:
  push:
    tags:
      - 'ctl-v*'

# Least privilege: only the release job needs write; the build matrix is read-only.
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: fracture-ctl
            archive: fracture-ctl-linux-amd64.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            binary: fracture-ctl
            archive: fracture-ctl-linux-arm64.tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            binary: fracture-ctl
            archive: fracture-ctl-macos-amd64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: fracture-ctl
            archive: fracture-ctl-macos-arm64.tar.gz

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          # Pinned by SHA, so the channel must be named explicitly (the @stable
          # ref no longer conveys it).
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p fracture-ctl
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.archive }} ${{ matrix.binary }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          merge-multiple: true

      - name: Generate checksums
        # `fracture-ctl update` downloads SHA256SUMS and refuses to install a
        # binary that doesn't match, so this file must ship with every release.
        run: sha256sum fracture-ctl-*.tar.gz > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
          files: |
            fracture-ctl-linux-amd64.tar.gz
            fracture-ctl-linux-arm64.tar.gz
            fracture-ctl-macos-amd64.tar.gz
            fracture-ctl-macos-arm64.tar.gz
            SHA256SUMS
