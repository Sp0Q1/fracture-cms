name: Release fracture-ctl

on:
  push:
    tags:
      - 'ctl-v*'

# Least privilege: only the release job needs write; the build matrix is read-only.
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: fracture-ctl
            archive: fracture-ctl-linux-amd64.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            binary: fracture-ctl
            archive: fracture-ctl-linux-arm64.tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            binary: fracture-ctl
            archive: fracture-ctl-macos-amd64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: fracture-ctl
            archive: fracture-ctl-macos-arm64.tar.gz

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p fracture-ctl
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.archive }} ${{ matrix.binary }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Generate checksums
        # `fracture-ctl update` downloads SHA256SUMS and refuses to install a
        # binary that doesn't match, so this file must ship with every release.
        run: sha256sum fracture-ctl-*.tar.gz > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            fracture-ctl-linux-amd64.tar.gz
            fracture-ctl-linux-arm64.tar.gz
            fracture-ctl-macos-amd64.tar.gz
            fracture-ctl-macos-arm64.tar.gz
            SHA256SUMS
