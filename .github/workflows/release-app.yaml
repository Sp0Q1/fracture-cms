# Reusable workflow: build and push a container image on release.
#
# Downstream projects call this with:
#
#   name: Release
#   on:
#     push:
#       tags: ['v*']
#   jobs:
#     ci:
#       uses: ./.github/workflows/ci.yaml
#     release:
#       needs: ci
#       uses: Sp0Q1/fracture-cms/.github/workflows/release-app.yaml@main
#       with:
#         image_name: ghcr.io/${{ github.repository }}
#       secrets: inherit

name: Release App Image

on:
  workflow_call:
    inputs:
      image_name:
        description: 'Full image name (e.g. ghcr.io/your-org/your-app)'
        required: true
        type: string
      containerfile:
        description: 'Path to Containerfile'
        required: false
        type: string
        default: 'Containerfile.prod'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version and lowercase image name
        id: meta
        env:
          RAW_IMAGE: ${{ inputs.image_name }}
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "image=$(echo "$RAW_IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        # BuildKit + GHA layer cache: the Containerfile's cargo-chef stage
        # makes the dependency build its own layer, so with mode=max a tag
        # whose dependencies are unchanged only recompiles the app crates
        # instead of the whole workspace from scratch.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.containerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
