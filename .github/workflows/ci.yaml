name: CI
on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_call:
  schedule:
    # Daily audit-only run: new RUSTSEC advisories land independently of
    # commits, so a cron catches what per-PR runs cannot. The other jobs
    # skip scheduled events.
    - cron: '17 4 * * *'

env:
  RUST_TOOLCHAIN: stable
  TOOLCHAIN_PROFILE: minimal

jobs:
  rustfmt:
    name: Check Style
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'

    permissions:
      contents: read

    steps:
      - name: Checkout the code
        uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - name: Run cargo fmt
        run: cargo fmt --all -- --check

  clippy:
    name: Run Clippy
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'

    permissions:
      contents: read

    steps:
      - name: Checkout the code
        uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Run cargo clippy
        run: cargo clippy --all-features -- -D warnings -W clippy::pedantic -W clippy::nursery -W rust-2018-idioms

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'

    permissions:
      contents: read

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout the code
        uses: actions/checkout@v7
      - name: Run semgrep
        run: semgrep scan --config auto --error --exclude-rule python.django.security.django-no-csrf-token.django-no-csrf-token .

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'

    permissions:
      contents: read

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_DB: postgres_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        # Set health checks to wait until postgres has started
        options: --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout the code
        uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Run cargo test
        run: cargo test --all-features --all
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres_test

  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout the code
        uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install cargo-audit
        # Prebuilt binary: `cargo install` compiled it from source on every
        # run (~minutes); this is seconds.
        uses: taiki-e/install-action@cargo-audit
      - name: Run cargo audit
        run: cargo audit
          
