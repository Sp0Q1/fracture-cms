name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  release:
    needs: ci
    uses: ./.github/workflows/release-app.yaml
    with:
      image_name: ghcr.io/${{ github.repository }}
    # No `secrets: inherit` — the reusable workflow only needs GITHUB_TOKEN,
    # which is provided automatically; inheriting would expose every repo secret.
