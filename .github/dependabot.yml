version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Wait before adopting a freshly published release: a malicious version in a
    # compromised-package attack is usually yanked within days, so a cooldown
    # avoids ever bumping to it.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    # tera 2.x is a breaking major that loco-rs 0.16 does not support (it pins
    # tera 1.x and re-exports its types via ViewEngine). Ignore tera majors
    # until loco itself moves to tera 2, so dependabot stops proposing a bump
    # that cannot build.
    ignore:
      - dependency-name: "tera"
        update-types: ["version-update:semver-major"]
    reviewers:
      - Sp0Q1

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    reviewers:
      - Sp0Q1
