[package]
name = "fracture-core"
description = "Core library for Fracture CMS: OIDC auth, org management, RBAC, and multi-tenant infrastructure"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
loco-rs = { workspace = true }
sea-orm = { workspace = true }
axum = { version = "0.8" }
axum-extra = { version = "0.12", features = ["form", "cookie"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
chrono = { version = "0.4" }
uuid = { version = "1.23", features = ["v4"] }
async-trait = { version = "0.1" }
openidconnect = { version = "4.0" }
jsonwebtoken = { version = "10" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
form_urlencoded = { version = "1" }
comrak = { version = "0.52", default-features = false }
slug = { version = "0.1" }
include_dir = { version = "0.7", features = ["glob"] }
tera = { version = "1" }
time = { version = "0.3" }
tracing = { version = "0.1" }
validator = { version = "0.20" }
sha2 = "0.10"
tokio = { version = "1", features = ["fs"] }
thiserror = "2"
fracture-core-migration = { path = "migration" }
