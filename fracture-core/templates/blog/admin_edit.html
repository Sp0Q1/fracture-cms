{% extends "base.html" %}

{% block title %}Edit: {{ post.title }} — Fracture CMS{% endblock title %}

{% block page_title_block %}{% endblock page_title_block %}

{% block content %}
<div class="page-header">
    <h1>Edit Blog Post</h1>
    <p class="page-subtitle">{{ post.title }}</p>
</div>

<article class="card form-card">
    <form action="/admin/blog/{{ post.pid }}" method="post">
        <div data-field>
            <label for="title">Title</label>
            <input id="title" name="title" type="text" value="{{ post.title }}" placeholder="Post title" required />
        </div>
        <div data-field>
            <label for="slug">Slug</label>
            <input id="slug" name="slug" type="text" value="{{ post.slug }}" disabled />
            <small data-hint>Slug cannot be changed after creation.</small>
        </div>
        <div data-field>
            <label for="excerpt">Excerpt</label>
            <input id="excerpt" name="excerpt" type="text" value="{{ post.excerpt | default(value='') }}" placeholder="Brief summary (optional)" />
        </div>
        <div data-field>
            <label for="body">Body (Markdown)</label>
            <textarea id="body" name="body" rows="20" placeholder="Write your post in Markdown..." required>{{ post.body }}</textarea>
        </div>
        <details>
            <summary>SEO Settings</summary>
            <div data-field>
                <label for="meta_title">Meta Title</label>
                <input id="meta_title" name="meta_title" type="text" value="{{ post.meta_title | default(value='') }}" placeholder="Override page title for search engines" />
            </div>
            <div data-field>
                <label for="meta_description">Meta Description</label>
                <input id="meta_description" name="meta_description" type="text" value="{{ post.meta_description | default(value='') }}" placeholder="Description for search engine results" />
            </div>
        </details>
        <div class="form-actions">
            <button type="submit">Save Changes</button>
            <a href="/admin/blog" class="button" data-variant="secondary">Cancel</a>
        </div>
    </form>
</article>
{% endblock content %}
