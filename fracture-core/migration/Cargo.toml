[package]
name = "fracture-core-migration"
description = "Database migrations for the fracture-core library (users, orgs, members, invites)"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "fracture_core_migration"
path = "src/lib.rs"

[dependencies]
loco-rs = { workspace = true }

[dependencies.sea-orm-migration]
version = "1.1"
features = [
  "runtime-tokio-rustls",
]
