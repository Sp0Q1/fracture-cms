services:
  # Central identity provider. Realms are imported declaratively from
  # dev/keycloak/import on boot (no post-start API scripting):
  #   - tenant-acme : a tenant realm (self-registration on, the app's client)
  #   - staff       : the cross-tenant staff realm, brokered INTO each tenant
  #                   realm via OIDC. This mirrors the production topology —
  #                   realm-per-tenant for hard isolation, one staff realm
  #                   that every tenant realm trusts. See docs/FEDERATION.md.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./dev/keycloak/import:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:8080:8080"

  mailcrab:
    image: docker.io/marlonb/mailcrab:latest
    ports:
      - "127.0.0.1:1080:1080"
      - "127.0.0.1:1025:1025"

  app:
    build:
      context: .
      dockerfile: Containerfile.dev
    network_mode: host
    depends_on:
      keycloak:
        condition: service_started
      mailcrab:
        condition: service_started
    volumes:
      - ./config:/app/config:ro
      - ./assets:/app/assets:ro
    env_file:
      - .env
    environment:
      # The app is one tenant deployment → it points at one tenant realm.
      - OIDC_ISSUER_URL=http://localhost:8080/realms/tenant-acme
      - OIDC_REDIRECT_URI=http://localhost:5150/api/auth/oidc/callback
      - OIDC_POST_LOGOUT_REDIRECT_URI=http://localhost:5150
      - MAILER_HOST=localhost
      - MAILER_ENABLED=true
      # Bind to loopback only; with network_mode: host this listener is on the
      # host directly, so 0.0.0.0 would expose the dev app on every interface.
      - SERVER_BINDING=${SERVER_BINDING:-127.0.0.1}
    entrypoint: ["/entrypoint.sh"]
